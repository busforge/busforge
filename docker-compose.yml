# Busforge as a single self-hosted container.
#
# Everything site-specific is an environment variable, so this file runs as-is
# and a deployment overlays its own file for image registry, storage path and
# reverse-proxy wiring:
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# No host port is published here on purpose. Busforge has no authentication of
# its own, and compose can only add published ports, never withdraw them, so a
# port in this file would be forced on every deployment that fronts the
# container with a proxy. Publish it in your own overlay:
#
#   services:
#     busforge:
#       ports: ["127.0.0.1:3000:3000"]
services:
  busforge:
    image: ${BUSFORGE_IMAGE:-busforge:latest}
    container_name: busforge
    restart: unless-stopped
    environment:
      - PORT=3000
      - TZ=${TZ:-UTC}
      # Encrypts KNX Data Secure tool keys at rest. Losing it makes every stored
      # key unrecoverable, so set it explicitly and back it up. Passed through
      # only when it is set: an empty value would look like a configured key.
      - BUSFORGE_MASTER_KEY
    volumes:
      # SQLite database, device backups and snapshots: all persistent state.
      # A named volume by default, or set BUSFORGE_DATA to a host path.
      - ${BUSFORGE_DATA:-busforge-data}:/app/apps/server/data

volumes:
  busforge-data:
