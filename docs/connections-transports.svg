<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="busforge's three ways to reach the KNX bus: local USB, KNX-IP interface, and remote USB via the bridge">
  <style>
    :root{
      --paper:#faf7f2; --paper2:#f2ede4; --ink:#1c1917; --muted:#57534e; --soft:#78716c;
      --rule:rgba(28,25,23,0.12); --rule2:rgba(120,113,108,0.25);
      --accent:#b5523a; --accent-tint:rgba(181,82,58,0.08); --store:rgba(28,25,23,0.04);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#1c1917; --paper2:#292524; --ink:#faf7f2; --muted:#a8a29e; --soft:#8e8680;
        --rule:rgba(250,247,242,0.12); --rule2:rgba(168,162,158,0.25);
        --accent:#d6724a; --accent-tint:rgba(214,114,74,0.12); --store:rgba(250,247,242,0.05);
      }
    }
    .bg{fill:var(--paper)}
    .box{fill:var(--paper);stroke:var(--ink);stroke-width:1}
    .ext{fill:var(--store);stroke:var(--muted);stroke-width:1}
    .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5}
    .busbar{fill:var(--paper2);stroke:var(--rule2);stroke-width:1}
    .name{fill:var(--ink);font-size:13px;font-weight:600}
    .sub{fill:var(--muted);font-size:9px;font-family:ui-monospace,'SF Mono',Menlo,monospace}
    .eyebrow{fill:var(--soft);font-size:8px;font-weight:500;font-family:ui-monospace,monospace;letter-spacing:.18em}
    .title{fill:var(--ink);font-size:26px;font-family:'Instrument Serif',Georgia,serif}
    .tag{fill:none;stroke:var(--muted);stroke-width:.8}
    .tagt{fill:var(--muted);font-size:7px;font-family:ui-monospace,monospace;letter-spacing:.08em}
    .ftag{stroke:var(--accent)} .ftagt{fill:var(--accent)}
    .alabel{fill:var(--soft);font-size:8px;font-family:ui-monospace,monospace;letter-spacing:.06em}
    .mask{fill:var(--paper)}
    .callout{fill:var(--soft);font-size:13px;font-style:italic;font-family:'Instrument Serif',Georgia,serif}
    .flow{stroke:var(--muted);stroke-width:1.2;fill:none}
    .flowa{stroke:var(--accent);stroke-width:1.6;fill:none}
    .boundary{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:5,4;opacity:.5}
    .legline{stroke:var(--rule);stroke-width:.8}
    .mk{fill:var(--muted)} .mka{fill:var(--accent)}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mka" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="780" height="520"/>

  <!-- header -->
  <text class="eyebrow" x="40" y="42">BUSFORGE · TRANSPORT ABSTRACTION</text>
  <text class="title" x="40" y="76">Three ways to the KNX bus</text>

  <!-- ============ arrows (drawn first, behind boxes) ============ -->
  <!-- busforge -> transports -->
  <path class="flow" d="M360 150 C280 168, 210 172, 170 194" marker-end="url(#a)"/>
  <path class="flow" d="M420 150 C500 168, 560 172, 590 194" marker-end="url(#a)"/>
  <!-- KnxUsbTransport -> local interface -->
  <path class="flow" d="M150 240 L150 292" marker-end="url(#a)"/>
  <!-- KnxIpTunnel -> gateway  and  -> bridge -->
  <path class="flow" d="M560 240 C500 262, 450 268, 420 292" marker-end="url(#a)"/>
  <path class="flowa" d="M620 240 C660 262, 660 268, 650 292" marker-end="url(#aa)"/>
  <!-- endpoints -> bus -->
  <path class="flow" d="M150 344 L150 404" marker-end="url(#a)"/>
  <path class="flow" d="M390 344 L390 404" marker-end="url(#a)"/>
  <path class="flowa" d="M650 356 L650 404" marker-end="url(#aa)"/>

  <!-- arrow labels -->
  <rect class="mask" x="130" y="262" width="40" height="12"/><text class="alabel" x="150" y="271" text-anchor="middle">node-hid</text>
  <rect class="mask" x="440" y="256" width="72" height="12"/><text class="alabel" x="476" y="265" text-anchor="middle">KNXnet/IP 3671</text>
  <rect class="mask" x="628" y="256" width="60" height="12"/><text class="alabel" x="658" y="265" text-anchor="middle">over the LAN</text>
  <rect class="mask" x="632" y="374" width="36" height="12"/><text class="alabel" x="650" y="383" text-anchor="middle">USB</text>

  <!-- ============ nodes ============ -->
  <!-- busforge (shared origin) -->
  <rect class="box" x="300" y="104" width="180" height="46" rx="6"/>
  <rect class="tag" x="308" y="110" width="52" height="12" rx="2"/><text class="tagt" x="334" y="119" text-anchor="middle">CLIENT</text>
  <text class="name" x="390" y="130" text-anchor="middle">busforge</text>
  <text class="sub" x="390" y="144" text-anchor="middle">server · runs anywhere</text>

  <!-- KnxTransport seam label -->
  <text class="alabel" x="390" y="176" text-anchor="middle" fill="var(--soft)">KnxTransport &#8212; connect · sendCemi · onCemi</text>

  <!-- transports -->
  <rect class="box" x="80" y="196" width="140" height="44" rx="6"/>
  <text class="name" x="150" y="222" text-anchor="middle">KnxUsbTransport</text>
  <text class="sub" x="150" y="234" text-anchor="middle">HID, same machine</text>

  <rect class="box" x="520" y="196" width="140" height="44" rx="6"/>
  <text class="name" x="590" y="222" text-anchor="middle">KnxIpTunnel</text>
  <text class="sub" x="590" y="234" text-anchor="middle">KNXnet/IP client</text>

  <!-- endpoints -->
  <rect class="ext" x="80" y="296" width="140" height="48" rx="6"/>
  <text class="name" x="150" y="318" text-anchor="middle">KNX-USB</text>
  <text class="sub" x="150" y="333" text-anchor="middle">interface (147b:5120)</text>

  <rect class="ext" x="320" y="296" width="140" height="48" rx="6"/>
  <text class="name" x="390" y="318" text-anchor="middle">KNXnet/IP</text>
  <text class="sub" x="390" y="333" text-anchor="middle">gateway (3rd-party)</text>

  <!-- bridge boundary (another machine) -->
  <rect class="boundary" x="548" y="286" width="196" height="70" rx="8"/>
  <rect class="mask" x="566" y="280" width="150" height="12"/>
  <text class="alabel" x="574" y="289" fill="var(--accent)">ANOTHER MACHINE · THE BENCH</text>

  <!-- busforge-bridge (FOCAL) -->
  <rect class="focal" x="560" y="296" width="180" height="56" rx="6"/>
  <rect class="tag ftag" x="568" y="302" width="60" height="12" rx="2"/><text class="tagt ftagt" x="598" y="311" text-anchor="middle">NEW</text>
  <text class="name" x="650" y="330" text-anchor="middle">busforge-bridge</text>
  <text class="sub" x="650" y="344" text-anchor="middle">KnxIpServer + KnxUsbTransport</text>

  <!-- KNX TP bus (shared) -->
  <rect class="busbar" x="80" y="404" width="660" height="36" rx="6"/>
  <text class="name" x="410" y="426" text-anchor="middle">KNX TP bus</text>

  <!-- editorial callout: multiplexing -->
  <text class="callout" x="40" y="474">A gateway to the client, either way &#8212; and the bridge multiplexes:</text>
  <text class="callout" x="40" y="492">one USB interface, many tunnels, so a monitor and a download run at once.</text>

  <!-- legend -->
  <line class="legline" x1="480" y1="462" x2="740" y2="462"/>
  <text class="eyebrow" x="480" y="478">LEGEND</text>
  <line class="flow" x1="540" y1="486" x2="566" y2="486" marker-end="url(#a)"/>
  <text class="sub" x="572" y="489">shared path</text>
  <line class="flowa" x1="648" y1="486" x2="674" y2="486" marker-end="url(#aa)"/>
  <text class="sub" x="680" y="489">the bridge</text>
</svg>
