<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Archivo', system-ui, sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
      .title  { font-family: 'Instrument Serif', Georgia, serif; }
      .name   { font-family: 'Archivo', system-ui, sans-serif; font-weight: 600; }
      .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .aside  { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(229,232,235,0.06)"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8d9399"/>
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f3a44a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="920" height="600" fill="#090e12"/>
  <rect width="920" height="600" fill="url(#dots)"/>

  <!-- header -->
  <text x="48" y="56" class="mono" fill="#f3a44a" font-size="11" letter-spacing="0.22em">STORAGE · SNAPSHOTS</text>
  <text x="48" y="96" class="title" fill="#e5e8eb" font-size="34">Restore points: config in, config out</text>
  <text x="48" y="122" class="name" fill="#8d9399" font-size="13" font-weight="400">A snapshot freezes only the config layer. Restore rewrites the live config and leaves the programmed baselines alone.</text>

  <!-- ===================== arrows (drawn before boxes) ===================== -->
  <!-- A -> B : serialize -->
  <path d="M 312 214 C 420 214, 470 214, 560 214" fill="none" stroke="#8d9399" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="392" y="190" width="96" height="16" rx="2" fill="#090e12"/>
  <text x="440" y="202" class="mono" fill="#aeb4ba" font-size="9" text-anchor="middle" letter-spacing="0.10em">① SERIALIZE</text>

  <!-- B -> A : restore rewrite (accent = headline) -->
  <path d="M 560 300 C 470 300, 420 300, 312 300" fill="none" stroke="#f3a44a" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <rect x="380" y="306" width="120" height="16" rx="2" fill="#090e12"/>
  <text x="440" y="318" class="mono" fill="#f3a44a" font-size="9" text-anchor="middle" letter-spacing="0.10em">② REWRITE · RESTORE</text>

  <!-- A <-> C : drift comparison (dashed, muted) -->
  <path d="M 172 344 L 172 392" fill="none" stroke="#717880" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="120" y="356" width="104" height="16" rx="2" fill="#090e12"/>
  <text x="172" y="368" class="mono" fill="#8d9399" font-size="8" text-anchor="middle" letter-spacing="0.08em">DRIFT: LIVE vs BASE</text>

  <!-- ===================== Node A: Config layer (live) ===================== -->
  <rect x="64" y="168" width="248" height="176" rx="8" fill="#13181d" stroke="#8d9399" stroke-width="1"/>
  <rect x="76" y="180" width="46" height="14" rx="2" fill="transparent" stroke="rgba(141,147,153,0.5)" stroke-width="0.8"/>
  <text x="99" y="190" class="mono" fill="#aeb4ba" font-size="7.5" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
  <text x="188" y="192" class="name" fill="#e5e8eb" font-size="14" text-anchor="middle">Config layer</text>

  <rect x="80" y="208" width="216" height="36" rx="5" fill="rgba(229,232,235,0.04)" stroke="rgba(141,147,153,0.25)" stroke-width="0.8"/>
  <text x="92" y="226" class="mono" fill="#e5e8eb" font-size="10">device_parameters</text>
  <text x="92" y="238" class="mono" fill="#8d9399" font-size="8">param values</text>

  <rect x="80" y="250" width="216" height="36" rx="5" fill="rgba(229,232,235,0.04)" stroke="rgba(141,147,153,0.25)" stroke-width="0.8"/>
  <text x="92" y="268" class="mono" fill="#e5e8eb" font-size="10">device_links</text>
  <text x="92" y="280" class="mono" fill="#8d9399" font-size="8">com-object → group address</text>

  <rect x="80" y="292" width="216" height="36" rx="5" fill="rgba(229,232,235,0.04)" stroke="rgba(141,147,153,0.25)" stroke-width="0.8"/>
  <text x="92" y="310" class="mono" fill="#e5e8eb" font-size="10">projects</text>
  <text x="92" y="322" class="mono" fill="#8d9399" font-size="8">name · interface ip/port</text>

  <!-- ===================== Node C: Baselines (untouched) ===================== -->
  <rect x="64" y="392" width="248" height="92" rx="8" fill="rgba(229,232,235,0.02)" stroke="rgba(141,147,153,0.4)" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="188" y="416" class="name" fill="#aeb4ba" font-size="13" text-anchor="middle">Baselines (programmed)</text>
  <text x="188" y="436" class="mono" fill="#8d9399" font-size="9.5" text-anchor="middle">device_param_base · device_link_base</text>
  <text x="188" y="462" class="mono" fill="#f3a44a" font-size="9" text-anchor="middle" letter-spacing="0.06em">↛ NOT REWRITTEN ON RESTORE</text>

  <!-- ===================== Node B: snapshots row (focal) ===================== -->
  <rect x="560" y="160" width="296" height="208" rx="8" fill="rgba(243,164,74,0.10)" stroke="#f3a44a" stroke-width="1.2"/>
  <rect x="572" y="172" width="60" height="14" rx="2" fill="transparent" stroke="rgba(243,164,74,0.55)" stroke-width="0.8"/>
  <text x="602" y="182" class="mono" fill="#f3a44a" font-size="7.5" text-anchor="middle" letter-spacing="0.08em">DB TABLE</text>
  <text x="708" y="184" class="name" fill="#f3a44a" font-size="15" text-anchor="middle">snapshots</text>

  <!-- columns -->
  <text x="576" y="208" class="mono" fill="#c9ced3" font-size="9.5">id · project_id · label</text>
  <text x="576" y="224" class="mono" fill="#c9ced3" font-size="9.5">kind <tspan fill="#8d9399">(manual|auto)</tspan> · reason</text>
  <text x="576" y="240" class="mono" fill="#c9ced3" font-size="9.5">created_at · schema_version</text>

  <!-- payload sub-box -->
  <rect x="576" y="252" width="264" height="100" rx="6" fill="rgba(9,14,18,0.6)" stroke="rgba(243,164,74,0.35)" stroke-width="0.8"/>
  <text x="588" y="270" class="mono" fill="#f3a44a" font-size="9" letter-spacing="0.06em">payload  =  JSON</text>
  <text x="588" y="290" class="mono" fill="#c9ced3" font-size="9">{ project: { name, interface },</text>
  <text x="588" y="306" class="mono" fill="#c9ced3" font-size="9">&#160;&#160;deviceParameters: [ … ],</text>
  <text x="588" y="322" class="mono" fill="#c9ced3" font-size="9">&#160;&#160;deviceLinks: [ … ] }</text>
  <text x="588" y="342" class="mono" fill="#8d9399" font-size="8">one row · auto dedups vs latest</text>

  <!-- editorial callout -->
  <text x="356" y="512" class="aside" fill="#aeb4ba" font-size="15">Restore first auto-captures the current config as a “before-restore” undo point (①),</text>
  <text x="356" y="532" class="aside" fill="#aeb4ba" font-size="15">then rewrites the live config from the payload (②). Drift indicators stay truthful.</text>

  <!-- legend strip -->
  <line x1="48" y1="560" x2="872" y2="560" stroke="rgba(229,232,235,0.12)" stroke-width="0.8"/>
  <text x="48" y="582" class="mono" fill="#8d9399" font-size="8" letter-spacing="0.16em">LEGEND</text>
  <rect x="120" y="574" width="11" height="11" rx="2" fill="rgba(243,164,74,0.10)" stroke="#f3a44a" stroke-width="1"/>
  <text x="138" y="583" class="mono" fill="#aeb4ba" font-size="9">restore point</text>
  <rect x="248" y="574" width="11" height="11" rx="2" fill="rgba(229,232,235,0.04)" stroke="rgba(141,147,153,0.25)" stroke-width="0.8"/>
  <text x="266" y="583" class="mono" fill="#aeb4ba" font-size="9">live config</text>
  <rect x="368" y="574" width="11" height="11" rx="2" fill="rgba(229,232,235,0.02)" stroke="rgba(141,147,153,0.4)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="386" y="583" class="mono" fill="#aeb4ba" font-size="9">untouched by restore</text>
  <line x1="520" y1="580" x2="552" y2="580" stroke="#f3a44a" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="560" y="583" class="mono" fill="#aeb4ba" font-size="9">restore write</text>
</svg>
