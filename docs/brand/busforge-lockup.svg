<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 56" role="img" aria-label="Busforge">
  <defs>
    <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc270"/>
      <stop offset=".5" stop-color="#f3a44a"/>
      <stop offset="1" stop-color="#e1862a"/>
    </linearGradient>
    <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=JetBrains+Mono:wght@500&amp;display=swap');</style>
  </defs>

  <!-- mark (32-grid scaled to 48px) -->
  <g transform="translate(0 4) scale(1.5)">
    <rect width="32" height="32" rx="7" fill="url(#bf)"/>
    <g fill="none" stroke="#221202" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22.5H28"/>
      <path d="M9 22.5V15"/>
      <path d="M23 22.5V15"/>
      <path d="M16 22.5V11.5"/>
      <rect x="6.2" y="9.4" width="5.6" height="5.6" rx="1.4"/>
      <rect x="20.2" y="9.4" width="5.6" height="5.6" rx="1.4"/>
      <rect x="11.8" y="4.6" width="8.4" height="6.9" rx="1.7"/>
    </g>
    <g fill="#221202">
      <circle cx="9" cy="22.5" r="1.7"/>
      <circle cx="16" cy="22.5" r="1.7"/>
      <circle cx="23" cy="22.5" r="1.7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="64" y="30" font-family="Archivo, sans-serif" font-weight="800" font-size="23"
        letter-spacing="3.6" fill="#1c1004">BUSFORGE</text>
  <text x="65.5" y="45" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="9.5"
        letter-spacing="2" fill="#8a6a3a">OPEN COMMISSIONING TOOL FOR KNX</text>
</svg>
