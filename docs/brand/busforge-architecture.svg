<svg id="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Busforge data flow: a project import or a device placed from the catalog lands in the store, is configured in the web UI, is programmed with backup and verify, and reaches the KNX bus through an IP interface, a USB interface or the bridge">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&amp;family=JetBrains+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');</style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(229,232,235,0.05)"/>
    </pattern>
    <marker id="a-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8d9399"/></marker>
    <marker id="a-muted-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8d9399"/></marker>
    <marker id="a-accent" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f3a44a"/></marker>
    <marker id="a-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57b5d8"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="560" fill="#090e12"/>
  <rect x="0" y="0" width="1280" height="560" fill="url(#dots)"/>

  <!-- header -->
  <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#f3a44a">DATA FLOW</text>
  <text x="40" y="92" font-family="'Instrument Serif', serif" font-size="34" fill="#e5e8eb">From an import, or from nothing, to a programmed device</text>

  <!-- ARROWS (drawn before boxes so they sit behind) -->
  <g fill="none">
    <!-- both entry points join into the store -->
    <path d="M216 176 H236 V216 H260" stroke="#8d9399" stroke-width="1.4" marker-end="url(#a-muted)"/>
    <path d="M216 268 H236 V224 H260" stroke="#8d9399" stroke-width="1.4" marker-end="url(#a-muted)"/>
    <!-- store <-> web ui -->
    <line x1="420" y1="220" x2="464" y2="220" stroke="#8d9399" stroke-width="1.4" marker-end="url(#a-muted)" marker-start="url(#a-muted-start)"/>
    <!-- ui -> program -->
    <line x1="624" y1="220" x2="668" y2="220" stroke="#8d9399" stroke-width="1.4" marker-end="url(#a-muted)"/>
    <!-- program -> interface -> bus (the headline path) -->
    <line x1="828" y1="220" x2="872" y2="220" stroke="#f3a44a" stroke-width="2" marker-end="url(#a-accent)"/>
    <line x1="1032" y1="220" x2="1076" y2="220" stroke="#f3a44a" stroke-width="2" marker-end="url(#a-accent)"/>
    <!-- read-back: the device answers, and that answer is the proof -->
    <path d="M1156 264 V344 H752 V268" stroke="#8d9399" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#a-muted)"/>
    <!-- live bus feed: devices -> monitor -> ui -->
    <path d="M1116 264 V416 H628" stroke="#57b5d8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a-link)"/>
    <path d="M544 388 V268" stroke="#57b5d8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a-link)"/>
  </g>

  <!-- arrow labels (masked so the line does not bleed through) -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.06em" text-anchor="middle">
    <rect x="424" y="206" width="36" height="13" fill="#090e12"/><text x="442" y="215" fill="#8d9399">EDIT</text>
    <rect x="626" y="206" width="40" height="13" fill="#090e12"/><text x="646" y="215" fill="#8d9399">BUILD</text>
    <rect x="828" y="206" width="44" height="13" fill="#090e12"/><text x="850" y="215" fill="#f3a44a">FLASH</text>
    <rect x="1032" y="206" width="44" height="13" fill="#090e12"/><text x="1054" y="215" fill="#f3a44a">TP BUS</text>
    <rect x="928" y="338" width="52" height="13" fill="#090e12"/><text x="954" y="347" fill="#8d9399">READ BACK</text>
    <rect x="856" y="410" width="36" height="13" fill="#090e12"/><text x="874" y="419" fill="#57b5d8">LIVE</text>
    <rect x="520" y="330" width="48" height="13" fill="#090e12"/><text x="544" y="339" fill="#57b5d8">DECODE</text>
  </g>

  <!-- ENTRY 1: import an existing project or catalog data -->
  <rect x="40" y="140" width="176" height="72" rx="8" fill="#090e12"/>
  <rect x="40" y="140" width="176" height="72" rx="8" fill="rgba(141,147,153,0.10)" stroke="#717880" stroke-width="1"/>
  <rect x="52" y="152" width="44" height="13" rx="2" fill="none" stroke="rgba(113,120,128,0.6)" stroke-width="0.8"/>
  <text x="74" y="161.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#a7adb3">IMPORT</text>
  <text x="128" y="186" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Existing project</text>
  <text x="128" y="202" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">.knxproj · .knxprod</text>

  <!-- ENTRY 2: start from nothing -->
  <rect x="40" y="232" width="176" height="72" rx="8" fill="#090e12"/>
  <rect x="40" y="232" width="176" height="72" rx="8" fill="rgba(141,147,153,0.10)" stroke="#717880" stroke-width="1"/>
  <rect x="52" y="244" width="36" height="13" rx="2" fill="none" stroke="rgba(113,120,128,0.6)" stroke-width="0.8"/>
  <text x="70" y="253.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#a7adb3">NEW</text>
  <text x="128" y="278" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Start from nothing</text>
  <text x="128" y="294" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">place from catalog</text>

  <!-- STORE -->
  <rect x="260" y="180" width="160" height="80" rx="8" fill="#090e12"/>
  <rect x="260" y="180" width="160" height="80" rx="8" fill="rgba(229,232,235,0.05)" stroke="#8d9399" stroke-width="1"/>
  <rect x="272" y="192" width="40" height="13" rx="2" fill="none" stroke="rgba(141,147,153,0.5)" stroke-width="0.8"/>
  <text x="292" y="201.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#8d9399">STORE</text>
  <text x="340" y="232" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">SQLite</text>
  <text x="340" y="250" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">config · catalog · keys</text>

  <!-- WEB UI -->
  <rect x="464" y="180" width="160" height="80" rx="8" fill="#090e12"/>
  <rect x="464" y="180" width="160" height="80" rx="8" fill="#13181d" stroke="rgba(141,147,153,0.45)" stroke-width="1"/>
  <rect x="476" y="192" width="34" height="13" rx="2" fill="none" stroke="rgba(141,147,153,0.4)" stroke-width="0.8"/>
  <text x="493" y="201.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#8d9399">APP</text>
  <text x="544" y="232" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Web UI</text>
  <text x="544" y="250" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">browse · configure</text>

  <!-- PROGRAM (the one focal node) -->
  <rect x="668" y="180" width="160" height="80" rx="8" fill="#090e12"/>
  <rect x="668" y="180" width="160" height="80" rx="8" fill="rgba(243,164,74,0.10)" stroke="#f3a44a" stroke-width="1.4"/>
  <rect x="680" y="192" width="36" height="13" rx="2" fill="none" stroke="rgba(243,164,74,0.6)" stroke-width="0.8"/>
  <text x="698" y="201.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#f3a44a">LOAD</text>
  <text x="748" y="232" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Program</text>
  <text x="748" y="250" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#cda36a">backup · flash · verify</text>

  <!-- INTERFACE: the three ways to the bus -->
  <rect x="872" y="172" width="160" height="96" rx="8" fill="#090e12"/>
  <rect x="872" y="172" width="160" height="96" rx="8" fill="#13181d" stroke="rgba(141,147,153,0.45)" stroke-width="1"/>
  <rect x="884" y="184" width="36" height="13" rx="2" fill="none" stroke="rgba(141,147,153,0.4)" stroke-width="0.8"/>
  <text x="902" y="193.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#8d9399">LINK</text>
  <text x="952" y="216" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Interface</text>
  <text x="952" y="234" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">KNXnet/IP gateway</text>
  <text x="952" y="248" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">KNX USB (HID)</text>
  <text x="952" y="262" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">bridge: USB over IP</text>

  <!-- KNX DEVICES (external) -->
  <rect x="1076" y="180" width="160" height="80" rx="8" fill="#090e12"/>
  <rect x="1076" y="180" width="160" height="80" rx="8" fill="rgba(229,232,235,0.03)" stroke="rgba(229,232,235,0.30)" stroke-width="1"/>
  <rect x="1088" y="192" width="32" height="13" rx="2" fill="none" stroke="rgba(229,232,235,0.3)" stroke-width="0.8"/>
  <text x="1104" y="201.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#aeb3b8">BUS</text>
  <text x="1156" y="232" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">KNX devices</text>
  <text x="1156" y="250" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">twisted pair</text>

  <!-- BUS MONITOR (feedback) -->
  <rect x="464" y="388" width="160" height="64" rx="8" fill="#090e12"/>
  <rect x="464" y="388" width="160" height="64" rx="8" fill="#13181d" stroke="rgba(87,181,216,0.45)" stroke-width="1"/>
  <rect x="476" y="398" width="34" height="13" rx="2" fill="none" stroke="rgba(87,181,216,0.5)" stroke-width="0.8"/>
  <text x="493" y="407.5" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.08em" text-anchor="middle" fill="#57b5d8">LIVE</text>
  <text x="544" y="430" font-family="Archivo, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#e5e8eb">Bus monitor</text>
  <text x="544" y="446" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#8d9399">decoded DPT values</text>

  <!-- legend -->
  <line x1="40" y1="496" x2="1240" y2="496" stroke="rgba(229,232,235,0.12)" stroke-width="0.8"/>
  <g font-family="'JetBrains Mono', monospace" font-size="8.5" letter-spacing="0.1em">
    <text x="40" y="520" fill="#8d9399">LEGEND</text>
    <line x1="120" y1="517" x2="148" y2="517" stroke="#8d9399" stroke-width="1.4"/>
    <text x="156" y="520" fill="#8d9399">CONFIGURE</text>
    <line x1="300" y1="517" x2="328" y2="517" stroke="#f3a44a" stroke-width="2"/>
    <text x="336" y="520" fill="#8d9399">PROGRAM / FLASH</text>
    <line x1="540" y1="517" x2="568" y2="517" stroke="#8d9399" stroke-width="1.4" stroke-dasharray="4,4"/>
    <text x="576" y="520" fill="#8d9399">READ BACK / VERIFY</text>
    <line x1="812" y1="517" x2="840" y2="517" stroke="#57b5d8" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="848" y="520" fill="#8d9399">LIVE BUS FEED</text>
  </g>
</svg>
