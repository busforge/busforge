            <title id="dg-t">How Busforge works: an ETS project, or a project started empty and filled from the manufacturers' product databases, is configured in the browser. Programming builds the device's memory image, reads the device to check its mask and back up what a partial write changes, and compares. A preview stops there. Otherwise it writes over a KNXnet/IP or USB interface, a partial write only what differs, and reads the device back: equal bytes mean verified, different bytes are reported. The bus monitor shows the bus live in the browser.</title>
