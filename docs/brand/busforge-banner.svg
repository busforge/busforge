<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Busforge: commission KNX from a browser">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc270"/><stop offset=".5" stop-color="#f3a44a"/><stop offset="1" stop-color="#e1862a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#f3a44a" stop-opacity=".16"/><stop offset="1" stop-color="#f3a44a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#e5e8eb" fill-opacity=".16"/>
    </pattern>
    <mask id="dotmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <filter id="tileglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#090e12"/>
    <rect width="1200" height="360" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#282f35" stroke-width="2"/>
  <!-- lockup, centred as one group: tile 72 + gap 24 + wordmark -->
  <g transform="translate(600 0)">
    <g transform="translate(-276 93)">
      <rect x="6" y="10" width="60" height="60" rx="14" fill="#f3a44a" opacity=".45" filter="url(#tileglow)"/>
      <g transform="scale(2.25)">
    <rect width="32" height="32" rx="7" fill="url(#tile)"/>
    <g fill="none" stroke="#221202" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22.5H28"/><path d="M9 22.5V15"/><path d="M23 22.5V15"/><path d="M16 22.5V11.5"/>
      <rect x="6.2" y="9.4" width="5.6" height="5.6" rx="1.4"/><rect x="20.2" y="9.4" width="5.6" height="5.6" rx="1.4"/>
      <rect x="11.8" y="4.6" width="8.4" height="6.9" rx="1.7"/>
    </g>
    <g fill="#221202"><circle cx="9" cy="22.5" r="1.7"/><circle cx="16" cy="22.5" r="1.7"/><circle cx="23" cy="22.5" r="1.7"/></g>
      </g>
    </g>
    <text x="-180" y="152" font-family="Archivo, sans-serif" font-weight="800" font-size="62" letter-spacing="12.4" fill="#e5e8eb">BUSFORGE</text>
    <text x="0" y="250" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="44" letter-spacing="-1" fill="#e5e8eb">Commission KNX from a browser.</text>
    <text x="0" y="292" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="400" font-size="20" fill="#c3c8cd">Import an ETS project, watch the bus, program real devices and read each one back.</text>
  </g>
</svg>
