<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Busforge">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc270"/>
      <stop offset=".5" stop-color="#f3a44a"/>
      <stop offset="1" stop-color="#e1862a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#f3a44a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f3a44a" stop-opacity="0"/>
    </radialGradient>
    <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap');</style>
  </defs>

  <!-- surface -->
  <rect width="1200" height="340" rx="22" fill="#090e12"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#282f35" stroke-width="2"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow)"/>

  <!-- faint full-width bus motif behind the lockup -->
  <g stroke="#f3a44a" stroke-opacity=".10" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M70 280 H1130"/>
    <path d="M210 280 V250"/><path d="M450 280 V250"/><path d="M750 280 V250"/><path d="M990 280 V250"/>
  </g>
  <g fill="#f3a44a" fill-opacity=".10">
    <circle cx="210" cy="280" r="4"/><circle cx="450" cy="280" r="4"/><circle cx="600" cy="280" r="4"/><circle cx="750" cy="280" r="4"/><circle cx="990" cy="280" r="4"/>
  </g>

  <!-- lockup: mark tile + wordmark + tagline, centered -->
  <g transform="translate(348 70)">
    <!-- mark tile (32-grid scaled to 96px) -->
    <g transform="scale(3)">
      <rect width="32" height="32" rx="7" fill="url(#tile)"/>
      <g fill="none" stroke="#221202" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22.5H28"/>
        <path d="M9 22.5V15"/><path d="M23 22.5V15"/><path d="M16 22.5V11.5"/>
        <rect x="6.2" y="9.4" width="5.6" height="5.6" rx="1.4"/>
        <rect x="20.2" y="9.4" width="5.6" height="5.6" rx="1.4"/>
        <rect x="11.8" y="4.6" width="8.4" height="6.9" rx="1.7"/>
      </g>
      <g fill="#221202">
        <circle cx="9" cy="22.5" r="1.7"/><circle cx="16" cy="22.5" r="1.7"/><circle cx="23" cy="22.5" r="1.7"/>
      </g>
    </g>

    <!-- wordmark + tagline -->
    <text x="128" y="62" font-family="Archivo, sans-serif" font-weight="800" font-size="76"
          letter-spacing="6" fill="#e5e8eb">BUSFORGE</text>
    <text x="131" y="98" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="18.5"
          letter-spacing="5.6" fill="#f3a44a">OPEN COMMISSIONING TOOL FOR KNX</text>
  </g>
</svg>
