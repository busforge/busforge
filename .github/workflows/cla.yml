name: CLA

# Asks each outside contributor once to agree to CLA.md, by a pull request comment, and records the
# signature in signatures/cla.json on the cla-signatures branch of this repository. That branch has
# to exist, unprotected, holding a signatures/cla.json of {"signedContributors": []}: this version
# of the action does not create a missing file (its not-found check compares the HTTP status to a
# string and never matches).
#
# pull_request_target runs this file from main with a write token. It checks out no pull request
# code, so nothing from a fork runs with that token.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write # re-run the check on the pull request once it is signed
  contents: write # commit the signature to the cla-signatures branch
  pull-requests: write # comment, and lock a closed pull request so a signature cannot be deleted

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/busforge/busforge/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: "tfohlmeister,dependabot[bot],renovate[bot],github-actions[bot]"
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please agree to the
            short [Contributor License Agreement](https://github.com/busforge/busforge/blob/main/CLA.md)
            by posting the comment below. You sign once, and it covers your later pull requests too.
            The sole reason for it is to allow Busforge to be dual-licensed, not to relicense it to a
            license that is not open source.
          custom-allsigned-prcomment: Everyone in this pull request has agreed to the CLA. Thank you.
