name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The same Bun the Dockerfile builds with.
    container: oven/bun:1.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BUSFORGE_CORPUS is not set: the corpus tests are skipped, and the last line of the check
      # says so (docs/testing.md, "The private corpus").
      - name: Run check
        run: |
          bun install --frozen-lockfile
          bun run check

  version:
    name: Determine version
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.compute.outputs.version }} # bare semver, e.g. 0.4.62
      tag: ${{ steps.compute.outputs.tag }} # tag form, e.g. v0.4.62 (baked into the image)
      bump: ${{ steps.compute.outputs.bump }}
      last_tag: ${{ steps.compute.outputs.last_tag }}
      skip: ${{ steps.compute.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, to compute the next version

      # The next release version is computed before the build, so the version baked into the image
      # is the one the release job tags. Conventional-commit subjects since the last tag decide the
      # bump.
      - name: Compute next version
        id: compute
        run: |
          LAST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="0.1.0"
            BUMP="initial"
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline)
            if [ -z "$COMMITS" ]; then
              # HEAD is exactly the last tag (a re-run): nothing to release, bake the existing tag.
              {
                echo "skip=true"
                echo "tag=$LAST_TAG"
                echo "version=${LAST_TAG#v}"
                echo "last_tag=$LAST_TAG"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$COMMITS" | grep -qiE "^[a-f0-9]+ (feat|fix|refactor|perf|test|chore|docs|style|ci|build|revert)(\(.+\))?!:" \
               || echo "$COMMITS" | grep -qiE "BREAKING CHANGE"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat(\(.+\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            CURRENT=${LAST_TAG#v}
            IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
            case "$BUMP" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN + 1)); PAT=0 ;;
              patch) PAT=$((PAT + 1)) ;;
            esac
            NEW_VERSION="$MAJ.$MIN.$PAT"
          fi
          {
            echo "version=$NEW_VERSION"
            echo "tag=v$NEW_VERSION"
            echo "bump=$BUMP"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build, push and start the image
    needs: [check, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine image name, tag and build stamp
        id: tags
        run: |
          {
            # ghcr.io wants the repository path in lower case.
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "sha_tag=main-$(git rev-parse --short=7 HEAD)"
            echo "commit=$(git rev-parse --short=7 HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The version the release job assigns to this commit, the short commit and the build
          # time, read back through /api/version (UI footer).
          build-args: |
            BUSFORGE_VERSION=${{ needs.version.outputs.tag }}
            BUSFORGE_COMMIT=${{ steps.tags.outputs.commit }}
            BUSFORGE_BUILT_AT=${{ steps.tags.outputs.built_at }}
          # latest moves only after the fresh-container start below.
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}

      # The release gate: the pushed image must start in a fresh container (no data volume) and
      # report the commit it was built from.
      - name: Start the image in a fresh container
        env:
          IMAGE_REF: ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}
          COMMIT: ${{ steps.tags.outputs.commit }}
          NAME: busforge-ci-${{ github.run_id }}
        run: |
          docker pull "$IMAGE_REF"
          # A cancelled earlier attempt of this run can leave the container behind.
          docker rm -f -v "$NAME" >/dev/null 2>&1 || true
          trap 'docker rm -f -v "$NAME" >/dev/null' EXIT
          docker run -d --name "$NAME" "$IMAGE_REF"
          REPORTED=""
          for _ in $(seq 1 30); do
            REPORTED=$(docker exec "$NAME" bun -e "const r = await fetch('http://localhost:3000/api/version'); if (!r.ok) process.exit(1); console.log((await r.json()).commit)" 2>/dev/null) && break
            REPORTED=""
            sleep 2
          done
          if [ "$REPORTED" != "$COMMIT" ]; then
            echo "fresh container reports commit '$REPORTED', expected '$COMMIT'"
            docker logs "$NAME"
            exit 1
          fi
          echo "fresh container serves commit $REPORTED"

      - name: Move latest to the started image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$SHA_TAG"

  # A release depends on the build and its fresh-container start.
  release:
    name: Release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag, the image's version tag and the release all use the version computed up front, so
      # they match the version baked into the image.
      - name: Create and push the version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image with the version
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:v$VERSION" "$IMAGE:$SHA_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUMP: ${{ needs.version.outputs.bump }}
          LAST_TAG: ${{ needs.version.outputs.last_tag }}
        run: |
          {
            echo "### $BUMP release"
            echo
            echo "#### Changes since ${LAST_TAG:-the beginning}"
            echo
            echo '```'
            git log "${LAST_TAG:+${LAST_TAG}..}HEAD" --oneline
            echo '```'
          } > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag
